map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $forwarded_proto $fastcgi_https {
    default off;
    https on;
}


upstream laravel_upstream {
    server app1:9000;
    server app2:9000;
}

upstream next_upstream {
    server nextjs:3000;
}

server {
    listen 80;
    index index.php index.html;
    server_name localhost;

    root /var/www/html/public;
    
    client_max_body_size 20M;

    location = /caddy-check {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Prometheus reaches this endpoint on the private Docker network. Public
    # ingress is denied by Caddy, and Nginx itself is host-loopback only.
    location = /internal/metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        try_files $uri /index.php?$query_string;
    }

    # Customer API handlers use HttpOnly cookies in Next.js.
    location ^~ /api/shop/ {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /v1/api/$1 last;
    }

    location /v1/api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /_debugbar/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /pulse {
        try_files $uri /index.php?$query_string;
    }

    location /pulse/ {
        try_files $uri /index.php?$query_string;
    }

    # Pulse loads its scripts and refreshes cards through Livewire routes.
    location ~ ^/livewire(?:-[a-zA-Z0-9]+)?/ {
        try_files $uri /index.php?$query_string;
    }

    location /locale {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /admin/ {
        absolute_redirect off;
        return 308 /admin$is_args$args;
    }

    location = /admin {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /admin/display {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /admin/display/ {
        absolute_redirect off;
        return 308 /admin/display$is_args$args;
    }

    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /next/auth {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Development-only helpers must never be reachable through production
    # ingress, even if application routing is accidentally changed later.
    location = /errors/preview/security-monitor {
        return 404;
    }

    location = /errors/preview/telegram-preview {
        return 404;
    }

    location /errors/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /home {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /login {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /logout {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /register {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /password {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /email {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /fonts/ {
        try_files $uri =404;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location /uploads/ {
        proxy_pass http://minio:9000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /app/ {
        proxy_pass http://soketi:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location ~* ^/(\.env|\.git|wp-admin|phpmyadmin|config\.json|setup\.php) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param HTTPS $fastcgi_https;
        # Preserve the original client address supplied by the host-level
        # Caddy proxy. The stock fastcgi_params file does not forward these
        # HTTP headers to PHP-FPM.
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
        fastcgi_param HTTP_X_REAL_IP $http_x_real_ip if_not_empty;
        fastcgi_pass laravel_upstream;
        fastcgi_index index.php;

        # Use consistent $document_root
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Optional: increase timeout for long requests
        fastcgi_read_timeout 300;
        add_header X-Backend-Server $upstream_addr always;
    }

    location ~ /\.ht {
        deny all;
    }
}

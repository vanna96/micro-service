<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 - Bad Gateway</title>
    <style>
        @import url('/fonts/error-fonts/fonts.css');

        :root {
            --bg: #ffffff;
            --text: #000000;
            --text-muted: #555555;
            --border: #000000;
            --btn-hover-bg: #000000;
            --btn-hover-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        html {
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        body {
            background-color: #ffffff !important;
            color: #000000 !important;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 520px;
            width: 100%;
            text-align: left;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: clamp(2.4rem, 6vw, 3.4rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.1;
            margin-bottom: 8px;
            color: #000000;
        }

        h2.subtitle {
            font-size: clamp(1.2rem, 3vw, 1.45rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.3;
            margin-bottom: 20px;
            color: #000000;
        }

        p.description {
            font-size: clamp(0.95rem, 2.2vw, 1.05rem);
            line-height: 1.6;
            margin-bottom: 28px;
            color: #000000;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 22px;
            font-size: 15px;
            color: #000000;
            background: transparent;
            border: 1px solid #000000;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            font-family: inherit;
        }

        .btn:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Error 502</h1>
        <h2 class="subtitle">Bad Gateway</h2>
        <p class="description">The server encountered a temporary error and could not complete your request. The
            upstream service is currently unavailable.</p>
        <div class="actions">
            <button onclick="window.location.reload()" class="btn">Try Again</button>
            <a href="/" class="btn">Home</a>
        </div>
        <p class="footer-text">nginx/1.31.6</p>
    </main>
</body>

</html>

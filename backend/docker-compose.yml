services:
  app1:
    build:
      context: ./php
    container_name: laravel_app1
    command: php-fpm
    restart: always
    volumes:
      - .:/var/www/html
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    healthcheck:
      # Fail if the source code bind mount is stale/empty (WSL2 race)
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app2:
    build:
      context: ./php
    container_name: laravel_app2
    command: php-fpm
    restart: always
    volumes:
      - .:/var/www/html
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    healthcheck:
      # Fail if the source code bind mount is stale/empty (WSL2 race)
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  queue:
    build:
      context: ./php
    container_name: laravel_queue
    command: /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: always
    ports:
      - "${RUNNING_PORT}:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    external: true

services:
  app1:
    build:
      context: ./php
    container_name: laravel_app1
    command: php-fpm
    restart: always
    volumes:
      - .:/var/www/html
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    healthcheck:
      # Confirm both the source mount and PHP-FPM are ready before Nginx starts.
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app2:
    build:
      context: ./php
    container_name: laravel_app2
    command: php-fpm
    restart: always
    volumes:
      - .:/var/www/html
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    healthcheck:
      # Confirm both the source mount and PHP-FPM are ready before Nginx starts.
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  queue:
    build:
      context: ./php
    container_name: laravel_queue
    command: /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: always
    ports:
      - "${RUNNING_PORT}:80"
    volumes:
      - .:/var/www/html
      # Directory mounts remain valid when an editor replaces default.conf in WSL.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    networks:
      - app-network

  nextjs:
    image: node:24-alpine
    container_name: laravel_nextjs
    working_dir: /var/www/html
    restart: always
    command: sh -lc "npm install && npm run next:${NEXT_MODE:-dev}"
    environment:
      LARAVEL_API_URL: http://nginx/v1/api
      NEXT_PUBLIC_API_URL: /v1/api
    volumes:
      - .:/var/www/html
      - next_node_modules:/var/www/html/node_modules
      - next_cache:/var/www/html/.next
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - app-network

  soketi:
    image: quay.io/soketi/soketi:1.4-16-alpine
    container_name: laravel_soketi
    restart: always
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "pos_app"
      SOKETI_DEFAULT_APP_KEY: "pos_key"
      SOKETI_DEFAULT_APP_SECRET: "pos_secret"
    ports:
      - "6001:6001"
    networks:
      - app-network

volumes:
  next_node_modules:
  next_cache:

networks:
  app-network:
    external: true

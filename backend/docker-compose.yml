services:
  app1:
    build:
      context: ./php
    container_name: laravel_app1
    command: php-fpm
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./lang:/var/www/html/lang
    healthcheck:
      # Confirm both the source mount and PHP-FPM are ready before Nginx starts.
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  app2:
    build:
      context: ./php
    container_name: laravel_app2
    command: php-fpm
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./lang:/var/www/html/lang
    healthcheck:
      # Confirm both the source mount and PHP-FPM are ready before Nginx starts.
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  queue:
    build:
      context: ./php
    container_name: laravel_queue
    command: /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./lang:/var/www/html/lang
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # Only the host-level Caddy proxy should reach Nginx directly.
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      # Directory mounts remain valid when an editor replaces default.conf in WSL.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    networks:
      - app-network


  nextjs:
    image: node:24-alpine
    container_name: laravel_nextjs
    working_dir: /var/www/html
    restart: always
    security_opt:
      - no-new-privileges:true
    command: sh -lc "npm ci && npm run next:${NEXT_MODE:-dev}"
    environment:
      LARAVEL_API_URL: http://nginx/v1/api
      NEXT_PUBLIC_API_URL: /v1/api
      APP_URL: ${APP_URL}
      CENTRAL_PORTAL_HOST: ${CENTRAL_PORTAL_HOST}
      NEXT_PUBLIC_PUSHER_APP_KEY: ${NEXT_PUBLIC_PUSHER_APP_KEY:-}
      NEXT_PUBLIC_PUSHER_PORT: ${NEXT_PUBLIC_PUSHER_PORT:-6001}
      NEXT_PUBLIC_PUSHER_SCHEME: ${NEXT_PUBLIC_PUSHER_SCHEME:-https}
      NEXT_PUBLIC_PUSHER_APP_CLUSTER: ${NEXT_PUBLIC_PUSHER_APP_CLUSTER:-mt1}
      NEXT_PUBLIC_LAN_IP: ${NEXT_PUBLIC_LAN_IP:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - .:/var/www/html:ro
      - /dev/null:/var/www/html/.env:ro
      - next_node_modules:/var/www/html/node_modules
      - next_cache:/var/www/html/.next
    healthcheck:
      # A page request runs middleware that calls Nginx, while Nginx waits for
      # this health check. Probe the Next.js listener to avoid that deadlock.
      test: ["CMD-SHELL", "node -e \"const socket=require('node:net').connect(3000,'127.0.0.1'); socket.setTimeout(3000); socket.once('connect',()=>{socket.destroy();process.exit(0)}); socket.once('error',()=>process.exit(1)); socket.once('timeout',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - app-network

  soketi:
    image: quay.io/soketi/soketi:1.4-16-alpine
    container_name: laravel_soketi
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "pos_app"
      SOKETI_DEFAULT_APP_KEY: "pos_key"
      SOKETI_DEFAULT_APP_SECRET: "pos_secret"
    ports:
      - "127.0.0.1:6001:6001"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: monitoring_prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
      - monitoring-network

  pulse:
    build:
      context: ./php
    container_name: monitoring_pulse
    restart: unless-stopped
    profiles: ["monitoring"]
    command: php artisan pulse:check
    user: www-data
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: monitoring_node_exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: monitoring_cadvisor
    restart: unless-stopped
    profiles: ["monitoring"]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitoring-network

volumes:
  next_node_modules:
  next_cache:
  prometheus_data:

networks:
  app-network:
    external: true
  monitoring-network:
    internal: true

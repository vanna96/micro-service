services:
  app:
    build:
      context: ./php
    command: php-fpm
    stop_signal: SIGQUIT
    cpus: 2.0
    mem_limit: 8g
    restart: always
    environment:
      CACHE_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./lang:/var/www/html/lang
      - ./php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
      - ./php/www-performance.conf:/usr/local/etc/php-fpm.d/zz-performance.conf:ro
    healthcheck:
      # Confirm both the source mount and PHP-FPM are ready before Nginx starts.
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  queue:
    build:
      context: ./php
    container_name: laravel_queue
    command: /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
    restart: always
    environment:
      CACHE_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    security_opt:
      - no-new-privileges:true
    volumes:
      - .:/var/www/html:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./lang:/var/www/html/lang
      - ./php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
      - ./php/www-performance.conf:/usr/local/etc/php-fpm.d/zz-performance.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  redis:
    image: redis:7.4-alpine
    container_name: laravel_redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    restart: always
    cpus: 0.5
    mem_limit: 320m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # Only the host-level Caddy proxy should reach Nginx directly.
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      # Directory mounts remain valid when an editor replaces default.conf in WSL.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./autoscaling/runtime:/etc/nginx/autoscaling
      - ./autoscaling/laravel-upstream.conf:/etc/nginx/laravel-upstream.template:ro
    command: ["sh", "-c", "test -s /etc/nginx/autoscaling/laravel-upstream.conf || cp /etc/nginx/laravel-upstream.template /etc/nginx/autoscaling/laravel-upstream.conf; exec nginx -g 'daemon off;'"]
    depends_on:
      app:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    networks:
      - app-network

  autoscaler:
    build:
      context: ./autoscaling
    container_name: laravel_autoscaler
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      AUTOSCALE_INTERVAL: ${AUTOSCALE_INTERVAL:-15}
      AUTOSCALE_UP_CPU: ${AUTOSCALE_UP_CPU:-70}
      AUTOSCALE_DOWN_CPU: ${AUTOSCALE_DOWN_CPU:-25}
      AUTOSCALE_UP_SECONDS: ${AUTOSCALE_UP_SECONDS:-60}
      AUTOSCALE_DOWN_SECONDS: ${AUTOSCALE_DOWN_SECONDS:-300}
      AUTOSCALE_COOLDOWN: ${AUTOSCALE_COOLDOWN:-300}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./autoscaling/runtime:/etc/nginx/autoscaling
      # Compose uses this file; the controller discovers its host-side source
      # path so newly created replicas bind the actual checkout, not /workspace.
      - .:/workspace:ro
    depends_on:
      app:
        condition: service_healthy
      nginx:
        condition: service_started
    network_mode: none
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "/app/autoscale.py", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s


  nextjs:
    image: node:24-alpine
    container_name: laravel_nextjs
    working_dir: /var/www/html
    restart: always
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -lc
      - |
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f 1)"
        installed_hash="$$(cat node_modules/.package-lock.sha256 2>/dev/null || true)"
        if [ "$$lock_hash" != "$$installed_hash" ]; then
          npm ci
          printf '%s\n' "$$lock_hash" > node_modules/.package-lock.sha256
        fi
        exec npm run "next:${NEXT_MODE:-dev}"
    environment:
      LARAVEL_API_URL: http://nginx/v1/api
      NEXT_PUBLIC_API_URL: /v1/api
      APP_URL: ${APP_URL}
      CENTRAL_PORTAL_HOST: ${CENTRAL_PORTAL_HOST}
      NEXT_PUBLIC_PUSHER_APP_KEY: ${NEXT_PUBLIC_PUSHER_APP_KEY:-}
      NEXT_PUBLIC_PUSHER_PORT: ${NEXT_PUBLIC_PUSHER_PORT:-6001}
      NEXT_PUBLIC_PUSHER_SCHEME: ${NEXT_PUBLIC_PUSHER_SCHEME:-https}
      NEXT_PUBLIC_PUSHER_APP_CLUSTER: ${NEXT_PUBLIC_PUSHER_APP_CLUSTER:-mt1}
      NEXT_PUBLIC_LAN_IP: ${NEXT_PUBLIC_LAN_IP:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}
    volumes:
      - .:/var/www/html:ro
      - /dev/null:/var/www/html/.env:ro
      - next_node_modules:/var/www/html/node_modules
      - next_cache:/var/www/html/.next
    healthcheck:
      # A page request runs middleware that calls Nginx, while Nginx waits for
      # this health check. Probe the Next.js listener to avoid that deadlock.
      test: ["CMD-SHELL", "node -e \"const socket=require('node:net').connect(3000,'127.0.0.1'); socket.setTimeout(3000); socket.once('connect',()=>{socket.destroy();process.exit(0)}); socket.once('error',()=>process.exit(1)); socket.once('timeout',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # A cold dependency install can take several minutes on a slow link.
      start_period: 10m
    networks:
      - app-network

  soketi:
    image: quay.io/soketi/soketi:1.4-16-alpine
    container_name: laravel_soketi
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "pos_app"
      SOKETI_DEFAULT_APP_KEY: "pos_key"
      SOKETI_DEFAULT_APP_SECRET: "pos_secret"
    ports:
      - "127.0.0.1:6001:6001"
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.7.2
    container_name: monitoring_prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
      - monitoring-network

  pulse:
    build:
      context: ./php
    container_name: monitoring_pulse
    restart: unless-stopped
    profiles: ["monitoring"]
    command: php artisan pulse:check
    environment:
      CACHE_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    user: www-data
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
      - ./php/www-performance.conf:/usr/local/etc/php-fpm.d/zz-performance.conf:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: monitoring_node_exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose:
      - "9100"
    security_opt:
      - no-new-privileges:true
    networks:
      - monitoring-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: monitoring_cadvisor
    restart: unless-stopped
    profiles: ["monitoring"]
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/lib/containerd:/var/lib/containerd:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitoring-network

volumes:
  next_node_modules:
  next_cache:
  prometheus_data:

networks:
  app-network:
    external: true
  monitoring-network:
    internal: true
